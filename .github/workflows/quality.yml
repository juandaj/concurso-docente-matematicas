name: Validación del simulador
on:
  push:
    branches: [main]
  pull_request:
jobs:
  calidad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Revisar sintaxis y banco de preguntas
        run: npm run check
